name: Deploy GeoSR-AI Backend to Azure Container Apps

on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
      - '.github/workflows/geosrai-backend-AutoDeployTrigger-2f579579-e4d6-49fe-bc1b-08cc81e3f413.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: geosrairegistry.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx (required for caching)
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: geosrairegistry.azurecr.io/geosrai-backend:latest
          # Cache layers so PyTorch/GDAL are NOT reinstalled unless requirements.txt changes
          cache-from: type=gha
          cache-to: type=gha,mode=max


      - name: Deploy new revision to Backend Container App
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.GEOSRAIBACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.GEOSRAIBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.GEOSRAIBACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App with new image
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update \
              --name geosrai-backend \
              --resource-group GeoSR-Group \
              --image geosrairegistry.azurecr.io/geosrai-backend:latest
