name: Deploy GeoSR-AI Worker to Azure Container Apps

on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
      - '.github/workflows/geosrai-worker-AutoDeployTrigger-2aa6e21c-dfc7-4a48-808a-0ec9729eb9b6.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.GEOSRAIBACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.GEOSRAIBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.GEOSRAIBACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Update Worker Container App with latest backend image
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update \
              --name geosrai-worker \
              --resource-group GeoSR-Group \
              --image geosrairegistry.azurecr.io/geosrai-backend:latest
