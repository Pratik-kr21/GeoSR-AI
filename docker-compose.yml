services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: geosrai
      POSTGRES_PASSWORD: password
      POSTGRES_DB: geosrai
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build: ./server
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - MINIO_ENDPOINT=minio:9000
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      - db
      - redis
      - minio
    volumes:
      - ./server:/app
      - ./server/data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  worker:
    build: ./server
    command: celery -A app.workers.celery_app worker --loglevel=info -Q geosrai_queue
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      - db
      - redis
      - minio
    volumes:
      - ./server:/app
      - ./server/data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # NOTE: The deploy block enables GPU support if the host has NVIDIA docker installed.
    # If the host doesn't have a GPU, Ollama will gracefully fallback to CPU.

volumes:
  postgres_data:
  minio_data:
  ollama_data:
