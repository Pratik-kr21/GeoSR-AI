services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: geosrai
      POSTGRES_PASSWORD: password
      POSTGRES_DB: geosrai
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build: ./server
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - MINIO_ENDPOINT=minio:9000
      - OPEN_METEO_BASE_URL=https://api.open-meteo.com/v1/forecast
    depends_on:
      - db
      - redis
      - minio
    volumes:
      - ./server:/app
      - ./server/data:/app/data

  worker:
    build: ./server
    command: celery -A app.workers.celery_app worker --loglevel=info -Q geosrai_queue --pool=solo
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - MINIO_ENDPOINT=minio:9000
      - OPEN_METEO_BASE_URL=https://api.open-meteo.com/v1/forecast
    depends_on:
      - db
      - redis
      - minio
    volumes:
      - ./server:/app
      - ./server/data:/app/data

volumes:
  postgres_data:
  minio_data:
